heat_exchange_station:
  display_name: 换热站
  forecast:
    target: heat_load
    feature_cols:
      - hour
      - day_of_week
      - month
      - is_weekend
      - heat_load_lag1
      - heat_load_lag24
      - heat_load_rolling_mean_24h
      - supply_temp_rolling_mean_24h
      - delta_T
      - outdoor_temp
      - supply_temp
      - return_temp
    model_params:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: 4
  anomaly:
    feature_cols:
      - supply_temp
      - return_temp
      - heat_load
      - outdoor_temp
    contamination: 0.05
    random_state: 42
    n_estimators: 200
    n_jobs: -1
    root_cause:
      small_delta_t: 2.0
      high_heat_load: 20.0
      outdoor_temp_stable: 1.0
      local_heat_load_deviation: 30.0
